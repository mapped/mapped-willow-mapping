<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapping Gaps</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .search-box { display: flex; align-items: center; gap: 6px; flex: 1; max-width: 480px; }
  .search-box input { flex: 1; padding: 6px 10px; background: #0f1117; border: 1px solid #3a3d4a; border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none; }
  .search-box input:focus { border-color: #5b8def; }
  .header-actions { display: flex; gap: 8px; margin-left: auto; }

  button { padding: 6px 14px; border: 1px solid #3a3d4a; border-radius: 6px; background: #1a1d27; color: #e0e0e0; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #2a2d3a; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }

  .main-area { display: flex; flex: 1; overflow: hidden; }
  .center-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #cy { flex: 1; background: #0f1117; }

  /* ── Gap detail view ── */
  #gapView { flex: 1; display: none; overflow: auto; }
  #gapView.active { display: flex; flex-direction: column; }

  /* Toolbar */
  .gap-toolbar { padding: 10px 24px; border-bottom: 1px solid #2a2d3a; background: #1a1d27; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  .gap-toolbar .gap-title { font-size: 14px; font-weight: 600; flex: 1; }
  .gap-toolbar .gap-dist { font-size: 12px; color: #888; }
  .gap-toolbar-actions { display: flex; gap: 8px; }

  /* Scrollable body */
  .gap-body { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  /* Suggest/search section */
  .gap-remap-section { width: 100%; max-width: 960px; }
  .gap-remap-section h3 { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .gap-search-input { width: 100%; padding: 8px 12px; background: #0f1117; border: 1px solid #3a3d4a; border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none; margin-bottom: 10px; }
  .gap-search-input:focus { border-color: #5b8def; }
  .gap-results-list { list-style: none; max-height: 260px; overflow-y: auto; }
  .gap-results-list li { padding: 8px 12px; border: 1.5px solid #2a2d3a; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.1s; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .gap-results-list li:hover { border-color: #5b8def; background: #1e293b; }
  .gap-results-list li.selected { border-color: #3b82f6; background: #1e3a5f; }
  .gap-results-list li .apply-check { margin-left: auto; background: none; border: none; padding: 2px 6px; cursor: pointer; font-size: 18px; line-height: 1; color: #22c55e; border-radius: 4px; flex-shrink: 0; }
  .gap-results-list li .apply-check:hover { background: rgba(34,197,94,0.2); }
  .gap-results-list .no-results { color: #555; cursor: default; border: none; }
  .gap-results-list .no-results:hover { background: none; border: none; }
  .gap-suggest-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .columns-container { display: flex; gap: 0; justify-content: center; align-items: flex-start; min-height: 200px; width: 100%; }
  .column { flex: 1; min-width: 0; max-width: 400px; }
  .column-header { text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 8px; margin-bottom: 8px; border-radius: 6px; }
  .column-header.left-header { background: rgba(59,130,246,0.15); color: #3b82f6; }
  .column-header.right-header { background: rgba(34,197,94,0.15); color: #22c55e; }
  .column-node { padding: 10px 14px; margin-bottom: 2px; border-radius: 6px; border: 1.5px solid #2a2d3a; background: #1a1d27; font-size: 13px; text-align: center; }
  .column-node .node-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subclass-arrow { text-align: center; color: #555; font-size: 18px; line-height: 18px; padding: 0; user-select: none; }
  .columns-wrapper { position: relative; width: 100%; max-width: 960px; }
  .cross-edge-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .middle-lane { width: 140px; flex-shrink: 0; }

  /* Sidebar */
  .sidebar { width: 380px; background: #1a1d27; border-left: 1px solid #2a2d3a; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .tab-bar { display: flex; border-bottom: 1px solid #2a2d3a; }
  .tab-bar button { flex: 1; border: none; border-radius: 0; border-bottom: 2px solid transparent; padding: 8px; font-size: 12px; }
  .tab-bar button.active { border-bottom-color: #3b82f6; color: #3b82f6; }
  .sidebar-content { flex: 1; overflow-y: auto; padding: 10px 14px; }

  .stats-bar { display: flex; gap: 16px; padding: 8px 16px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; font-size: 12px; color: #888; flex-shrink: 0; }
  .stats-bar span { display: flex; gap: 4px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.mapped { background: #3b82f6; }
  .dot.willow { background: #22c55e; }
  .dot.external { background: #6b7280; }

  .search-results { list-style: none; }
  .search-results li { padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .search-results li:hover { background: #2a2d3a; }
  .ont-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; text-transform: uppercase; flex-shrink: 0; }
  .ont-badge.mapped { background: #1e3a5f; color: #3b82f6; }
  .ont-badge.willow { background: #14532d; color: #22c55e; }
  .ont-badge.external { background: #374151; color: #9ca3af; }

  .node-detail { font-size: 13px; }
  .node-detail .label { color: #888; font-size: 11px; text-transform: uppercase; margin-top: 10px; margin-bottom: 2px; }
  .node-detail .value { word-break: break-all; }
  .node-detail .edge-list { list-style: none; margin-top: 4px; }
  .node-detail .edge-list li { padding: 3px 0; cursor: pointer; color: #93c5fd; }
  .node-detail .edge-list li:hover { text-decoration: underline; }
  .edge-type { font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 4px; }
  .edge-type.subClassOf { background: #3a2d1a; color: #f59e0b; }
  .edge-type.mapsTo { background: #1a2d3a; color: #38bdf8; }

  .gap-list { list-style: none; }
  .gap-item { padding: 8px; margin-bottom: 4px; border: 1px solid #2a2d3a; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .gap-item:hover { background: #2a2d3a; }
  .gap-item.selected { border-color: #3b82f6; background: #1e293b; }
  .gap-chain { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .gap-chain .arrow { color: #555; }
  .gap-distance-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: #2a2d3a; color: #e0e0e0; flex-shrink: 0; }
  .gap-count { font-size: 12px; color: #666; margin-bottom: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; padding: 20px; width: 420px; }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .modal label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
  .modal select, .modal input[type=file] { width: 100%; padding: 6px 10px; background: #0f1117; border: 1px solid #3a3d4a; border-radius: 6px; color: #e0e0e0; font-size: 13px; margin-bottom: 12px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #555; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Mapping Gaps</h1>
  <div class="search-box"><input id="searchInput" type="text" placeholder="Search nodes by name or ID..." /></div>
  <div class="header-actions">
    <button onclick="openUploadModal()">Upload</button>
    <button class="primary" onclick="runDiagnosis()">Diagnose</button>
  </div>
</header>

<div class="stats-bar">
  <span><span class="dot mapped"></span> Mapped: <b id="statMapped">-</b></span>
  <span><span class="dot willow"></span> Willow: <b id="statWillow">-</b></span>
  <span><span class="dot external"></span> External: <b id="statExternal">-</b></span>
  <span>|</span>
  <span>subClassOf: <b id="statSubclass">-</b></span>
  <span>mapsTo: <b id="statMapsTo">-</b></span>
</div>

<div class="main-area">
  <div class="center-pane">
    <div id="cy"></div>
    <div id="gapView"></div>
  </div>
  <div class="sidebar">
    <div class="tab-bar">
      <button class="active" data-tab="search" onclick="switchTab('search')">Search</button>
      <button data-tab="detail" onclick="switchTab('detail')">Detail</button>
      <button data-tab="diagnose" onclick="switchTab('diagnose')">Diagnosis</button>
    </div>
    <div class="sidebar-content" id="tab-search">
      <ul class="search-results" id="searchResults"></ul>
      <div id="searchEmpty" style="color:#555;font-size:13px;padding:20px 0;text-align:center;">Type to search nodes</div>
    </div>
    <div class="sidebar-content" id="tab-detail" style="display:none;">
      <div id="nodeDetail"><div style="color:#555;font-size:13px;padding:20px 0;text-align:center;">Click a node to view details</div></div>
    </div>
    <div class="sidebar-content" id="tab-diagnose" style="display:none;">
      <div id="diagnoseContent"><div style="color:#555;font-size:13px;padding:20px 0;text-align:center;">Click "Diagnose" to find roundtrip gaps</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="uploadModal">
  <div class="modal">
    <h2>Upload File</h2>
    <label>Type</label>
    <select id="uploadType">
      <option value="ontology:mapped">Ontology: Mapped</option>
      <option value="ontology:willow">Ontology: Willow</option>
      <option value="mapping:mapped2willow">Mapping: Mapped &rarr; Willow</option>
      <option value="mapping:willow2mapped">Mapping: Willow &rarr; Mapped</option>
    </select>
    <label>File (.json / .jsonld)</label>
    <input type="file" id="uploadFile" accept=".json,.jsonld" />
    <div class="actions">
      <button onclick="closeUploadModal()">Cancel</button>
      <button class="primary" onclick="doUpload()">Upload</button>
    </div>
  </div>
</div>

<script>
const cy = cytoscape({
  container: document.getElementById('cy'), elements: [],
  style: [
    { selector: 'node', style: { 'label': 'data(label)', 'font-size': '10px', 'color': '#ccc', 'text-valign': 'bottom', 'text-margin-y': 4, 'width': 16, 'height': 16, 'background-color': '#6b7280', 'border-width': 1, 'border-color': '#444' } },
    { selector: 'node[ontology="mapped"]', style: { 'background-color': '#3b82f6' } },
    { selector: 'node[ontology="willow"]', style: { 'background-color': '#22c55e' } },
    { selector: 'node[ontology="external"]', style: { 'background-color': '#6b7280' } },
    { selector: 'node.focused', style: { 'border-width': 3, 'border-color': '#facc15', 'width': 24, 'height': 24 } },
    { selector: 'edge', style: { 'width': 1.5, 'line-color': '#f59e0b', 'target-arrow-color': '#f59e0b', 'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier', 'opacity': 0.6 } },
    { selector: 'edge[type="mapsTo"]', style: { 'line-color': '#38bdf8', 'target-arrow-color': '#38bdf8', 'line-style': 'dashed' } },
  ],
  layout: { name: 'preset' }, minZoom: 0.05, maxZoom: 5, wheelSensitivity: 0.3,
});

let allGaps = [], graphData = null, selectedGapKey = null, totalDistance = 0, ignoredGaps = new Set();
let classFilterIds = null; // null = no filter, Set = only show gaps whose start is in this set
let currentGap = null, actionTargetId = null, remapSourceId = null, currentSuggest = null;

async function init() { graphData = await (await fetch('/api/graph')).json(); updateStats(graphData.stats); }
init();

function updateStats(s) {
  document.getElementById('statSubclass').textContent = s.subClassOf.toLocaleString();
  document.getElementById('statMapsTo').textContent = s.mapsTo.toLocaleString();
  let m=0,w=0,e=0;
  for (const n of graphData.nodes) { if(n.ontology==='mapped')m++; else if(n.ontology==='willow')w++; else e++; }
  document.getElementById('statMapped').textContent = m.toLocaleString();
  document.getElementById('statWillow').textContent = w.toLocaleString();
  document.getElementById('statExternal').textContent = e.toLocaleString();
}

function shortId(id) {
  const name = id.split(':').pop().replace(/;.*$/, '');
  if (id.startsWith('dtmi:com:willowinc:')) return 'willow:' + name;
  if (id.startsWith('dtmi:mapped:core:')) return 'mapped:' + name;
  if (id.includes(':brickschema:')) return 'brick:' + name;
  return name;
}
function tokenizeId(id) {
  const name = id.split(':').pop().replace(/;.*$/, '');
  const words = [];
  for (const p of name.split('_')) words.push(...p.replace(/([a-z])([A-Z])/g, '$1 $2').split(' '));
  return words.filter(w => w).map(w => w.toLowerCase()).join(' ');
}

// ── Views ──
function showCyView() { document.getElementById('cy').style.display = ''; document.getElementById('gapView').classList.remove('active'); }
function showGapView() { document.getElementById('cy').style.display = 'none'; document.getElementById('gapView').classList.add('active'); }

// ── Search ──
let searchTimeout = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('searchResults').innerHTML = ''; document.getElementById('searchEmpty').style.display = ''; return; }
  searchTimeout = setTimeout(() => doSearch(q), 200);
});
async function doSearch(q) {
  const results = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
  document.getElementById('searchEmpty').style.display = results.length ? 'none' : '';
  document.getElementById('searchResults').innerHTML = results.map(r => `
    <li onclick="focusNode('${r.id}')"><span class="ont-badge ${r.ontology}">${r.ontology}</span><span>${r.display_name || shortId(r.id)}</span></li>
  `).join('');
  switchTab('search');
}

// ── Focus node ──
async function focusNode(nodeId) {
  showCyView();
  const data = await (await fetch(`/api/neighborhood/${encodeURIComponent(nodeId)}`)).json();
  cy.elements().remove();
  for (const n of data.nodes) cy.add({ group: 'nodes', data: { id: n.id, label: n.display_name || shortId(n.id), ontology: n.ontology } });
  for (const e of data.edges) cy.add({ group: 'edges', data: { source: e.source, target: e.target, type: e.type } });
  cy.getElementById(nodeId)?.addClass('focused');
  cy.layout({ name: 'concentric', concentric: (n) => n.id() === nodeId ? 10 : 1, levelWidth: () => 1, minNodeSpacing: 40, animate: false }).run();
  cy.fit(undefined, 40);
  const node = data.nodes.find(n => n.id === nodeId);
  if (node) {
    const inc = data.edges.filter(e => e.target === nodeId), out = data.edges.filter(e => e.source === nodeId);
    const mkLi = (e, nid) => { const o = data.nodes.find(n => n.id === nid); return `<li onclick="focusNode('${nid}')"><span class="edge-type ${e.type}">${e.type}</span>${o ? (o.display_name || shortId(o.id)) : shortId(nid)}</li>`; };
    document.getElementById('nodeDetail').innerHTML = `<div class="node-detail">
      <div class="label">Name</div><div class="value"><b>${node.display_name || '(none)'}</b></div>
      <div class="label">ID</div><div class="value" style="font-size:11px;color:#888;">${node.id}</div>
      <div class="label">Ontology</div><div class="value"><span class="ont-badge ${node.ontology}">${node.ontology}</span></div>
      <div class="label">Incoming (${inc.length})</div><ul class="edge-list">${inc.map(e => mkLi(e, e.source)).join('') || '<li style="color:#555">none</li>'}</ul>
      <div class="label">Outgoing (${out.length})</div><ul class="edge-list">${out.map(e => mkLi(e, e.target)).join('') || '<li style="color:#555">none</li>'}</ul>
    </div>`;
  }
  switchTab('detail');
}
cy.on('tap', 'node', async (evt) => { await focusNode(evt.target.id()); });

// ── Tabs ──
function switchTab(name) {
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ['search','detail','diagnose'].forEach(t => document.getElementById('tab-'+t).style.display = t === name ? '' : 'none');
}

// ── Upload ──
function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }
async function doUpload() {
  const [kind, key] = document.getElementById('uploadType').value.split(':');
  const fi = document.getElementById('uploadFile'); if (!fi.files.length) return alert('Select a file');
  const fd = new FormData(); fd.append('file', fi.files[0]);
  if (kind === 'ontology') fd.append('ontology', key); else fd.append('direction', key);
  const res = await (await fetch(kind === 'ontology' ? '/api/upload/ontology' : '/api/upload/mapping', { method: 'POST', body: fd })).json();
  if (res.error) { alert(res.error); return; }
  closeUploadModal(); graphData = await (await fetch('/api/graph')).json(); updateStats(graphData.stats); cy.elements().remove();
}

// ── Diagnosis ──
let allUnmapped = [], diagView = 'gaps';

async function runDiagnosis() {
  switchTab('diagnose');
  document.getElementById('diagnoseContent').innerHTML = '<div style="text-align:center;padding:30px;"><span class="spinner"></span> Analyzing...</div>';
  const data = await (await fetch('/api/diagnose')).json();
  allGaps = data.gaps; totalDistance = data.total_distance; allUnmapped = data.unmapped || [];
  renderDiagPanel();
}

function renderDiagPanel() {
  const all = allGaps.filter(g => !ignoredGaps.has(gapKey(g)));
  const filterLabel = classFilterIds ? `<span style="font-size:11px;color:#3b82f6;cursor:pointer;" onclick="clearClassFilter()">clear</span>` : '';
  document.getElementById('diagnoseContent').innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:10px;font-size:12px;">
      <span style="cursor:pointer;padding:4px 0;border-bottom:2px solid ${diagView==='gaps'?'#3b82f6':'transparent'};color:${diagView==='gaps'?'#3b82f6':'#888'};" onclick="diagView='gaps';renderDiagBody();">
        Gaps (${all.length}) &middot; distance: ${totalDistance}
      </span>
      <span style="cursor:pointer;padding:4px 0;border-bottom:2px solid ${diagView==='unmapped'?'#3b82f6':'transparent'};color:${diagView==='unmapped'?'#3b82f6':'#888'};" onclick="diagView='unmapped';renderDiagBody();">
        Unmapped (${allUnmapped.length})
      </span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;position:relative;">
      <div style="position:relative;flex-shrink:0;">
        <input type="text" id="classFilterInput" placeholder="Filter by class..." style="width:200px;padding:5px 8px;background:#0f1117;border:1px solid #3a3d4a;border-radius:6px;color:#e0e0e0;font-size:12px;outline:none;" />
        <ul id="classFilterDropdown" style="display:none;position:absolute;top:100%;left:0;width:300px;background:#1a1d27;border:1px solid #3a3d4a;border-radius:6px;max-height:220px;overflow-y:auto;list-style:none;margin-top:4px;z-index:20;"></ul>
      </div>
      ${filterLabel}
    </div>
    <div id="diagBody"></div>`;
  document.getElementById('classFilterInput').addEventListener('input', onClassFilterInput);
  renderDiagBody();
}

function renderDiagBody() {
  if (diagView === 'gaps') renderGapListInner();
  else renderUnmappedList();
}

function gapKey(g) { return g.start + '|' + g.mid + '|' + g.end; }

function gapSearchScore(g, terms) {
  const positions = [tokenizeId(g.start), tokenizeId(g.mid), tokenizeId(g.end)];
  const all = positions.join(' ');
  if (!terms.every(t => all.includes(t))) return -1;
  let score = 0, posIdx = 0;
  for (const t of terms) { while (posIdx < 3 && !positions[posIdx].includes(t)) posIdx++; if (posIdx < 3) { score += 3 - posIdx; posIdx++; } }
  score += 10 / all.split(' ').length;
  return score;
}

function filterVisibleGaps() {
  const q = (document.getElementById('gapFilterInput')?.value || '').toLowerCase().trim();
  const terms = q ? q.split(/\s+/) : [];
  let visible = allGaps.filter(g => !ignoredGaps.has(gapKey(g)));
  if (classFilterIds) visible = visible.filter(g => classFilterIds.has(g.start));
  if (terms.length) {
    const scored = [];
    for (const g of visible) { const s = gapSearchScore(g, terms); if (s >= 0) scored.push([s, g]); }
    scored.sort((a, b) => b[0] - a[0]);
    visible = scored.map(x => x[1]);
  }
  return visible;
}

function renderGapList() {
  diagView = 'gaps';
  renderDiagPanel();
}

function renderGapListInner() {
  document.getElementById('diagBody').innerHTML = `
    <input type="text" id="gapFilterInput" placeholder="Search gaps..." oninput="renderFilteredGaps()" style="width:100%;padding:5px 8px;margin-bottom:8px;background:#0f1117;border:1px solid #3a3d4a;border-radius:6px;color:#e0e0e0;font-size:12px;outline:none;" />
    <ul class="gap-list" id="gapList"></ul>`;
  renderFilteredGaps();
}

function renderUnmappedList() {
  const body = document.getElementById('diagBody');
  body.innerHTML = `
    <input type="text" id="unmappedFilter" placeholder="Search unmapped..." oninput="filterUnmapped()" style="width:100%;padding:5px 8px;margin-bottom:8px;background:#0f1117;border:1px solid #3a3d4a;border-radius:6px;color:#e0e0e0;font-size:12px;outline:none;" />
    <ul class="gap-list" id="unmappedList"></ul>`;
  filterUnmapped();
}

function filterUnmapped() {
  const q = (document.getElementById('unmappedFilter')?.value || '').toLowerCase().trim();
  const terms = q ? q.split(/\s+/) : [];
  let visible = allUnmapped;
  if (classFilterIds) visible = visible.filter(u => classFilterIds.has(u.id));
  if (terms.length) {
    visible = visible.filter(u => {
      const hay = tokenizeId(u.id) + ' ' + (u.display_name || '').toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  const ul = document.getElementById('unmappedList');
  ul.innerHTML = visible.slice(0, 500).map(u => `
    <li class="gap-item" onclick="selectUnmapped('${u.id}', '${u.ontology}')">
      <span class="ont-badge ${u.ontology}">${u.ontology}</span>
      <span>${shortId(u.id)}</span>
    </li>`).join('') + (visible.length > 500 ? `<li style="padding:8px;color:#555;text-align:center;">Showing 500 of ${visible.length}</li>` : '');
}

let classFilterTimeout = null;
function onClassFilterInput(e) {
  clearTimeout(classFilterTimeout);
  const q = e.target.value.trim();
  const ul = document.getElementById('classFilterDropdown');
  if (!q) { ul.style.display = 'none'; return; }
  classFilterTimeout = setTimeout(async () => {
    const results = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
    if (!results.length) { ul.innerHTML = '<li style="color:#555;padding:8px;">No matches</li>'; ul.style.display = ''; return; }
    ul.innerHTML = results.slice(0, 15).map(r => `<li style="padding:6px 10px;cursor:pointer;font-size:12px;" onclick="applyClassFilter('${r.id}')">${shortId(r.id)}</li>`).join('');
    ul.style.display = '';
  }, 200);
}

async function applyClassFilter(nodeId) {
  document.getElementById('classFilterDropdown').style.display = 'none';
  document.getElementById('classFilterInput').value = shortId(nodeId);
  const descendants = await (await fetch(`/api/descendants/${encodeURIComponent(nodeId)}`)).json();
  classFilterIds = new Set(descendants);
  renderDiagBody();
}

function clearClassFilter() {
  classFilterIds = null;
  renderDiagPanel();
}

function renderFilteredGaps() {
  const visible = filterVisibleGaps();
  document.getElementById('gapList').innerHTML = visible.slice(0, 500).map(g => {
    const sel = gapKey(g) === selectedGapKey ? ' selected' : '';
    return `<li class="gap-item${sel}" data-gapkey="${gapKey(g)}" onclick='selectGap(${JSON.stringify(g)})'>
      <span class="gap-distance-badge">${g.distance !== null ? '+' + g.distance : '?'}</span>
      <div class="gap-chain"><span>${shortId(g.start)}</span><span class="arrow">&rarr;</span><span>${shortId(g.mid)}</span><span class="arrow">&rarr;</span><span>${shortId(g.end)}</span></div>
    </li>`;
  }).join('') + (visible.length > 500 ? `<li style="padding:8px;color:#555;text-align:center;">Showing 500 of ${visible.length}</li>` : '');
}

async function selectUnmapped(nodeId, ontology) {
  currentGap = { start: nodeId, mid: null, end: null, start_ontology: ontology, distance: null };
  remapSourceId = nodeId;
  actionTargetId = null;

  const suggest = await (await fetch(`/api/suggest-mappings/${encodeURIComponent(nodeId)}`)).json();
  currentSuggest = suggest;

  showGapView();
  const targetOnt = ontology === 'willow' ? 'mapped' : 'willow';
  const ontLabel = ontology === 'mapped' ? 'Mapped' : ontology === 'willow' ? 'Willow' : ontology;

  const detail = await (await fetch(`/api/gap-detail?start=${encodeURIComponent(nodeId)}&mid=${encodeURIComponent(nodeId)}&end=${encodeURIComponent(nodeId)}`)).json();
  const leftNodes = [...detail.left].reverse();
  const nodeH = (n) => `<div class="column-node" data-node-id="${n.id}"><div class="node-name">${shortId(n.id)}</div></div>`;
  let leftHtml = '';
  for (let i = 0; i < leftNodes.length; i++) { leftHtml += nodeH(leftNodes[i]); if (i < leftNodes.length - 1) leftHtml += '<div class="subclass-arrow">&uarr;</div>'; }

  document.getElementById('gapView').innerHTML = `
    <div class="gap-toolbar">
      <button onclick="showCyView()" style="padding:4px 10px;">&larr;</button>
      <span class="gap-title">${shortId(nodeId)} &rarr; <b>?</b></span>
      <span class="gap-dist">unmapped</span>
      <div class="gap-toolbar-actions"></div>
    </div>
    <div class="gap-body">
      <div class="columns-wrapper">
        <div class="columns-container">
          <div class="column" id="leftColumn"><div class="column-header left-header">${ontLabel}</div>${leftHtml}<div id="leftRemapTarget"></div></div>
          <div class="middle-lane"></div>
          <div class="column" id="rightColumn"><div class="column-header right-header">${targetOnt}</div><div id="rightRemapTarget"></div></div>
        </div>
      </div>
    </div>`;
  renderRemapSection();
}

async function gapApplyUnmapped() {
  if (!remapSourceId || !actionTargetId) return;
  const source = remapSourceId;
  const newTarget = actionTargetId;
  const res = await (await fetch('/api/mapping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();
  if (res.error) {
    const addExc = confirm(`Constraint violation:\n${res.error}\n\nAdd ${shortId(source)} \u2194 ${shortId(newTarget)} as an exception?`);
    if (!addExc) return;
    await (await fetch('/api/add-exception', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();
    const retry = await (await fetch('/api/mapping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();
    if (retry.error) { alert(retry.error); return; }
  }
  const [gResp, dResp] = await Promise.all([fetch('/api/graph'), fetch('/api/diagnose')]);
  graphData = await gResp.json(); updateStats(graphData.stats);
  const d = await dResp.json(); allGaps = d.gaps; totalDistance = d.total_distance; allUnmapped = d.unmapped || [];
  renderDiagPanel();
  // Show the newly created mapping as a gap detail
  const ont = source.startsWith('dtmi:com:willowinc:') ? 'willow' : 'mapped';
  await selectGap({ start: source, mid: newTarget, end: newTarget, start_ontology: ont, distance: 0 });
}

// ── Select gap → render toolbar + columns ──
async function selectGap(gap) {
  currentGap = gap; actionTargetId = null;
  selectedGapKey = gapKey(gap);
  document.querySelectorAll('.gap-item').forEach(el => el.classList.toggle('selected', el.dataset.gapkey === selectedGapKey));

  const [detail, suggest] = await Promise.all([
    (await fetch(`/api/gap-detail?start=${encodeURIComponent(gap.start)}&mid=${encodeURIComponent(gap.mid)}&end=${encodeURIComponent(gap.end)}`)).json(),
    (await fetch(`/api/suggest-mappings/${encodeURIComponent(gap.start)}`)).json(),
  ]);
  renderGapDetail(detail, gap, suggest);
}

function renderGapDetail(detail, gap, suggest) {
  showGapView();
  remapSourceId = gap.start; // default: remap A→B
  currentSuggest = suggest;
  const container = document.getElementById('gapView');
  const leftOnt = detail.left[0]?.ontology || '?';
  const rightOnt = detail.right[0]?.ontology || '?';
  const leftLabel = leftOnt === 'mapped' ? 'Mapped' : leftOnt === 'willow' ? 'Willow' : leftOnt;
  const rightLabel = rightOnt === 'mapped' ? 'Mapped' : rightOnt === 'willow' ? 'Willow' : rightOnt;

  const nodeHtml = (n, column) => {
    const clickable = (column === 'left' && n.id === gap.start) || (column === 'right' && n.id === gap.mid);
    const onclick = clickable ? `onclick="switchRemapSource('${n.id}')"` : '';
    const cursor = clickable ? 'cursor:pointer;' : '';
    const sel = n.id === remapSourceId ? 'border-color:#3b82f6;' : '';
    return `<div class="column-node" data-node-id="${n.id}" ${onclick} style="${cursor}${sel}"><div class="node-name">${shortId(n.id)}</div></div>`;
  };
  const leftNodes = [...detail.left].reverse(), rightNodes = [...detail.right].reverse();
  let leftHtml = '', rightHtml = '';
  for (let i = 0; i < leftNodes.length; i++) { leftHtml += nodeHtml(leftNodes[i], 'left'); if (i < leftNodes.length - 1) leftHtml += '<div class="subclass-arrow">&uarr;</div>'; }
  for (let i = 0; i < rightNodes.length; i++) { rightHtml += nodeHtml(rightNodes[i], 'right'); if (i < rightNodes.length - 1) rightHtml += '<div class="subclass-arrow">&uarr;</div>'; }

  container.innerHTML = `
    <div class="gap-toolbar">
      <button onclick="showCyView()" style="padding:4px 10px;">&larr;</button>
      <span class="gap-title">${shortId(gap.start)} &rarr; ${shortId(gap.mid)} &rarr; ${shortId(gap.end)}</span>
      <span class="gap-dist">distance +${gap.distance ?? '?'}</span>
      <div class="gap-toolbar-actions">
        <button onclick="gapFlag()">Flag gap</button>
        <button onclick="gapIgnore()">Ignore</button>
      </div>
    </div>
    <div class="gap-body">
      <div class="columns-wrapper" id="columnsWrapper">
        <svg class="cross-edge-svg" id="crossEdgeSvg"></svg>
        <div class="columns-container">
          <div class="column" id="leftColumn"><div class="column-header left-header">${leftLabel}</div>${leftHtml}<div id="leftRemapTarget"></div></div>
          <div class="middle-lane"></div>
          <div class="column" id="rightColumn"><div class="column-header right-header">${rightLabel}</div>${rightHtml}<div id="rightRemapTarget"></div></div>
        </div>
      </div>
    </div>`;

  renderRemapSection();
  requestAnimationFrame(() => requestAnimationFrame(() => drawCrossEdges(detail)));
}

async function switchRemapSource(nodeId) {
  if (nodeId === remapSourceId) return;
  remapSourceId = nodeId;
  actionTargetId = null;
  // Fetch new suggestions for this source
  currentSuggest = await (await fetch(`/api/suggest-mappings/${encodeURIComponent(nodeId)}`)).json();
  // Re-highlight selected node in columns
  document.querySelectorAll('.column-node').forEach(el => {
    el.style.borderColor = el.dataset.nodeId === nodeId ? '#3b82f6' : '';
  });
  renderRemapSection();
}

function renderRemapSection() {
  const suggest = currentSuggest;
  const sourceOnt = (() => {
    const id = remapSourceId || '';
    if (id.startsWith('dtmi:com:willowinc:')) return 'willow';
    return 'mapped';
  })();
  const targetOnt = sourceOnt === 'willow' ? 'mapped' : 'willow';

  // Determine which column gets the search UI (opposite of source)
  const leftTarget = document.getElementById('leftRemapTarget');
  const rightTarget = document.getElementById('rightRemapTarget');
  if (leftTarget) leftTarget.innerHTML = '';
  if (rightTarget) rightTarget.innerHTML = '';

  // Source in left column → search goes in right, and vice versa
  // In gap view, gap.start is always left, gap.mid is always right
  const isSourceLeft = !currentGap?.mid || remapSourceId !== currentGap.mid;
  const container = isSourceLeft ? rightTarget : leftTarget;
  if (!container) return;

  const sugItems = suggest?.suggestions?.length
    ? suggest.suggestions.slice(0, 3).map(s =>
        `<li onclick="gapSelectTarget('${s.id}', this)">${shortId(s.id)}</li>`
      ).join('')
    : '<li class="no-results">No suggestions</li>';

  container.innerHTML = `
    <div class="gap-remap-section" style="margin-top:12px;">
      <h3>Remap ${shortId(remapSourceId)} &rarr; ?</h3>
      <input type="text" class="gap-search-input" id="gapSearchInput" placeholder="Search ${targetOnt} classes..." data-target-ont="${targetOnt}" />
      <div class="gap-suggest-label">Suggestions</div>
      <ul class="gap-results-list" id="gapResultsList">${sugItems}</ul>
    </div>`;

  document.getElementById('gapSearchInput').addEventListener('input', gapOnSearchInput);
}

function drawCrossEdges(detail) {
  const svg = document.getElementById('crossEdgeSvg'), wrapper = document.getElementById('columnsWrapper');
  if (!svg || !wrapper) return;
  const wr = wrapper.getBoundingClientRect();
  svg.setAttribute('width', wr.width); svg.setAttribute('height', wr.height);
  svg.style.width = wr.width + 'px'; svg.style.height = wr.height + 'px';
  const leftIds = new Set(detail.left.map(n => n.id)), pos = {};
  document.querySelectorAll('.column-node[data-node-id]').forEach(el => {
    const nid = el.dataset.nodeId, r = el.getBoundingClientRect();
    const isLeft = leftIds.has(nid) && el.closest('#leftColumn');
    pos[nid + (isLeft ? ':L' : ':R')] = { x: isLeft ? (r.right - wr.left) : (r.left - wr.left), y: r.top + r.height/2 - wr.top };
  });
  let c = `<defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#38bdf8"/></marker>
    <marker id="ah-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#38bdf8"/></marker>
  </defs>`;
  for (const ce of detail.cross_edges) {
    const sk = ce.direction === 'left_to_right' ? ce.source+':L' : ce.source+':R';
    const dk = ce.direction === 'left_to_right' ? ce.target+':R' : ce.target+':L';
    const s = pos[sk], d = pos[dk]; if (!s || !d) continue;
    const mx = (s.x + d.x) / 2;
    const markers = ce.bidirectional ? 'marker-start="url(#ah-rev)" marker-end="url(#ah)"' : 'marker-end="url(#ah)"';
    c += `<path d="M ${s.x} ${s.y} C ${mx} ${s.y}, ${mx} ${d.y}, ${d.x} ${d.y}" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7" ${markers}/>`;
  }
  svg.innerHTML = c;
}

// ── Gap actions ──
let gapSearchTimeout = null;
function gapOnSearchInput(e) {
  clearTimeout(gapSearchTimeout);
  const q = e.target.value.trim();
  const ul = document.getElementById('gapResultsList');
  const label = document.querySelector('.gap-suggest-label');
  if (!q) {
    // Restore default suggestions
    label.textContent = 'Suggestions';
    const suggest = currentSuggest;
    const sugItems = suggest?.suggestions?.length
      ? suggest.suggestions.slice(0, 3).map(s =>
          `<li onclick="gapSelectTarget('${s.id}', this)">${shortId(s.id)}</li>`
        ).join('')
      : '<li class="no-results">No suggestions</li>';
    ul.innerHTML = sugItems;
    return;
  }
  gapSearchTimeout = setTimeout(async () => {
    label.textContent = 'Results';
    const results = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&ontology=${encodeURIComponent(e.target.dataset.targetOnt)}`)).json();
    if (!results.length) { ul.innerHTML = '<li class="no-results">No matches</li>'; return; }
    ul.innerHTML = results.map(r => `<li onclick="gapSelectTarget('${r.id}', this)">${shortId(r.id)}</li>`).join('');
  }, 200);
}

function gapSelectTarget(nodeId, el) {
  actionTargetId = nodeId;
  // Clear previous selection and checkmarks
  document.querySelectorAll('.gap-results-list li').forEach(e => {
    e.classList.remove('selected');
    const old = e.querySelector('.apply-check');
    if (old) old.remove();
  });
  if (el) {
    el.classList.add('selected');
    const check = document.createElement('button');
    check.className = 'apply-check';
    check.innerHTML = '&#x2714;';
    check.title = 'Apply mapping';
    check.onclick = (e) => { e.stopPropagation(); doApply(); };
    el.appendChild(check);
  }
}

async function doApply() {
  if (!actionTargetId || !remapSourceId) return;
  const isUnmapped = !currentGap?.mid;
  if (isUnmapped) { await gapApplyUnmapped(); }
  else { await gapApply(); }
}

async function gapApply() {
  if (!currentGap || !actionTargetId) return;
  const newTarget = actionTargetId;
  const source = remapSourceId;
  const res = await (await fetch('/api/mapping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();

  if (res.error) {
    const addExc = confirm(`Constraint violation:\n${res.error}\n\nAdd ${shortId(source)} \u2194 ${shortId(newTarget)} as an exception?`);
    if (!addExc) return;
    await (await fetch('/api/add-exception', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();
    const retry = await (await fetch('/api/mapping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, target: newTarget }) })).json();
    if (retry.error) { alert(retry.error); return; }
  }

  const [gResp, dResp] = await Promise.all([fetch('/api/graph'), fetch('/api/diagnose')]);
  graphData = await gResp.json(); updateStats(graphData.stats);
  const d = await dResp.json(); allGaps = d.gaps; totalDistance = d.total_distance; allUnmapped = d.unmapped || []; renderGapList();
  const updatedGap = { ...currentGap };
  if (source === currentGap.start) updatedGap.mid = newTarget;
  await selectGap(updatedGap);
}

async function gapFlag() {
  if (!currentGap) return;
  await fetch('/api/flag-gap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start: currentGap.start, mid: currentGap.mid, end: currentGap.end }) });
  const d = await (await fetch('/api/diagnose')).json(); allGaps = d.gaps; totalDistance = d.total_distance; allUnmapped = d.unmapped || [];  showCyView(); renderGapList();
}

function gapIgnore() {
  if (!currentGap) return;
  ignoredGaps.add(gapKey(currentGap));
  showCyView(); renderGapList();
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') showCyView();
});
</script>
</body>
</html>
